<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>La Pluma del Fénix | Escritos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Portada de entrada -->
  <div id="prologo">
    <div class="emblema">fxapollo presenta</div>
    <h1>La Pluma del Fénix</h1>
    <p>Relatos diseñados para leerse despacio. Sin anuncios ni cortes bruscos: cada escena transforma la atmósfera mientras avanzas.</p>
    <button class="btn-iniciar" onclick="comenzarLectura()">Comenzar lectura con sonido</button>
  </div>

  <!-- Barra superior -->
  <header>
    <div class="marca">La Pluma del Fénix</div>
    <div class="controles">
      <span id="pista-actual">En silencio</span>
      <button class="btn-pill" onclick="toggleBuscador()">Buscar música</button>
      <button class="btn-pill" id="btn-mute" onclick="toggleMute()">Silenciar</button>
    </div>
  </header>

  <!-- Buscador integrado sin anuncios -->
  <div id="panel-buscador">
    <input type="text" id="input-busqueda" placeholder="Escribe canción o ambiente (ej. melancholy, piano)..." onkeyup="buscarAudius(event)">
    <div id="resultados-musica">
      <div class="estado-busqueda">Presiona Enter para buscar en el catálogo sin anuncios...</div>
    </div>
  </div>

  <!-- Contenedor donde app.js inyecta automáticamente tus escritos -->
  <main id="lector-escenas"></main>

  <script src="app.js"></script>
</body>
</html>
